# Decap CMS Configuration — Client-Friendly Edition
# Docs: https://decapcms.org/docs/configuration-options/

backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: "Add {{collection}} — {{slug}}"
    update: "Edit {{collection}} — {{slug}}"
    delete: "Remove {{collection}} — {{slug}}"
    uploadMedia: "Upload photo"
    deleteMedia: "Remove photo"

# Photos uploaded through the admin are saved here
media_folder: "public/uploads"
public_folder: "/uploads"

# Live site URL (shown in CMS top bar)
site_url: https://engriteinnovations.com

# Single Save = Publish (no draft workflow — keeps things simple for the client)
# Removed: publish_mode: editorial_workflow

locale: en

# Custom CSS to make the admin look more like the Engrite brand
# (loaded from /admin/admin.css)
media_library:
  name: ''
  config:
    max_file_size: 5242880  # 5MB limit — prevents huge uploads breaking the build

collections:
  # ============================================================
  # PROPERTIES — main collection, organized into friendly sections
  # ============================================================
  - name: "properties"
    label: "Properties"
    label_singular: "Property"
    folder: "content/properties"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{name}} — {{location}}"
    sortable_fields: ["name", "status", "startingPrice"]
    view_filters:
      - label: "Active Selling"
        field: status
        pattern: "under-construction"
      - label: "Sample Units Open"
        field: status
        pattern: "sample-units-open"
      - label: "Off-Plan"
        field: status
        pattern: "off-plan"
      - label: "Last Units"
        field: status
        pattern: "last-units"
    fields:

      # ===========================================================
      # 🏠 PROPERTY BASICS
      # ===========================================================
      - { name: "name", label: "🏠 Property Name", widget: "string", hint: "e.g. Sinai Spaces, Crest Residence" }
      - { name: "slug", label: "Web Address (auto-filled)", widget: "string", hint: "Lowercase, no spaces. Auto-fills from the name but you can change it. Example: sinai-spaces" }
      - { name: "tagline", label: "Short Tagline", widget: "string", hint: "One-line highlight shown under the name. Example: 'Spaces For You! — Affordable entry-point to Lagos property ownership'" }
      - name: "status"
        label: "Current Status"
        widget: "select"
        hint: "Pick the one that matches where the property is right now"
        options:
          - { label: "🚧 Under Construction", value: "under-construction" }
          - { label: "🏠 Sample Units Open", value: "sample-units-open" }
          - { label: "📐 Off-Plan (Pre-Launch)", value: "off-plan" }
          - { label: "⏳ Last Units Remaining", value: "last-units" }
        default: "under-construction"
      - { name: "statusLabel", label: "Status Badge Text", widget: "string", hint: "Short text shown on the property card. Example: 'Active Selling' or 'Last 3 Units'", default: "Active Selling" }
      - { name: "location", label: "Location", widget: "string", hint: "Full address or area. Example: 'Akoka, Yaba, Lagos'" }
      - { name: "completionDate", label: "Availability Note", widget: "string", hint: "What buyers see about timing. Example: 'Active Selling — Units Available' or 'Off-Plan — 12-Month Build Cycle'", default: "Active Selling — Units Available" }

      # ===========================================================
      # 📸 PHOTOS
      # ===========================================================
      - { name: "image", label: "📸 Main Photo (Card Image)", widget: "image", hint: "This is the photo people see first on the homepage and property cards. Landscape orientation works best (1200×900 recommended)." }
      - name: "gallery"
        label: "Photo Gallery"
        widget: "list"
        min: 1
        field: { name: "image", label: "Photo", widget: "image" }
        hint: "Add at least 3 photos. These show when someone clicks into the property detail page."

      # ===========================================================
      # 💰 PRICING & UNITS
      # ===========================================================
      - { name: "startingPrice", label: "💰 Starting Price (₦)", widget: "number", value_type: "int", min: 0, hint: "The 'from' price shown on the card. Example: 17000000 for ₦17M" }
      - { name: "annualReturn", label: "Target Gross Yield %", widget: "number", value_type: "float", min: 0, max: 100, step: 0.1, hint: "Target gross yield assumption before costs. Example: 14", default: 14 }
      - name: "units"
        label: "Available Units (with prices)"
        widget: "list"
        hint: "List every unit type buyers can choose from. Click 'Add' to add a new unit type."
        fields:
          - { name: "name", label: "Unit Name", widget: "string", hint: "Example: 'Studio Apartment — Standard'" }
          - { name: "price", label: "Price (₦)", widget: "number", value_type: "int", min: 0, hint: "Full price in naira. Example: 17000000" }
          - { name: "size", label: "Size / Layout", widget: "string", hint: "Example: 'Compact studio' or '1 bedroom'" }
          - { name: "rentalYield", label: "Rental Income Range", widget: "string", hint: "Example: '₦2–3M/yr'" }
          - name: "features"
            label: "What's included in this unit"
            widget: "list"
            field: { name: "feature", label: "Feature", widget: "string" }
            hint: "Example: 'Inverter power', 'Premium fittings'"
      - name: "paymentSchedule"
        label: "Payment Plan (Milestones)"
        widget: "list"
        hint: "How buyers pay over time. Most properties use 3-4 milestones."
        fields:
          - { name: "milestone", label: "Milestone Name", widget: "string", hint: "Example: 'Initial Deposit'" }
          - { name: "percentage", label: "Percentage %", widget: "number", value_type: "int", min: 0, max: 100 }
          - { name: "description", label: "What happens at this milestone", widget: "string", hint: "Example: 'Secures your unit'" }

      # ===========================================================
      # 📝 DESCRIPTION
      # ===========================================================
      - { name: "shortDesc", label: "📝 Short Summary (shown on card)", widget: "text", hint: "1-2 sentences. This is what people see before clicking. Make it punchy." }
      - { name: "body", label: "Full Description", widget: "markdown", hint: "The detailed write-up shown on the property page. Use the toolbar above to format text — bold, headings, bullet points, etc." }
      - name: "tags"
        label: "Highlight Badges (shown on card)"
        widget: "list"
        field: { name: "tag", label: "Badge", widget: "string" }
        hint: "Short labels shown on the card. Max 4. Example: '17yr Lease', 'Smart Home', '24/7 Power'"
      - name: "features"
        label: "Property Highlights (on detail page)"
        widget: "list"
        field: { name: "feature", label: "Highlight", widget: "string" }
        hint: "Bigger feature list shown on the detail page. Example: '17-Year Lease', 'Live or Earn Model'"
      - name: "amenities"
        label: "Building Amenities"
        widget: "list"
        field: { name: "amenity", label: "Amenity", widget: "string" }
        hint: "What the building offers. Example: '24/7 Power', 'Gym', 'Parking', 'Security'"

      # ===========================================================
      # 🗺️ LOCATION MAP
      # ===========================================================
      - { name: "mapEmbed", label: "🗺️ Google Map Link", widget: "string", hint: "💡 How to get this: 1) Open Google Maps → search your property address 2) Click 'Share' → 'Embed a map' 3) Copy the URL from the iframe src (looks like https://www.google.com/maps?q=...&output=embed)" }

      # ===========================================================
      # 🎥 VIRTUAL TOUR & VIDEO (optional)
      # ===========================================================
      - { name: "videoUrl", label: "🎥 Walkthrough Video Link (optional)", widget: "string", required: false, hint: "YouTube, Vimeo, or direct MP4 link. Leave blank if not yet filmed. The 'Tour' button only shows if this is filled." }
      - { name: "matterportUrl", label: "360° Matterport Link (optional)", widget: "string", required: false, hint: "Only fill if you have a Matterport showcase URL. Most properties leave this blank." }
      - name: "tourScenes"
        label: "Fallback 360° Photos (optional)"
        widget: "list"
        required: false
        hint: "Used only when no video/Matterport link is set. Each scene is a 360° panorama image."
        fields:
          - { name: "id", label: "Scene ID", widget: "string", hint: "Short name like 'exterior' or 'lobby'" }
          - { name: "title", label: "Scene Title", widget: "string", hint: "Shown to viewers" }
          - { name: "image", label: "360° Photo", widget: "image" }

      # ===========================================================
      # ⚙️ ADVANCED (usually leave alone)
      # ===========================================================
      - name: "useCases"
        label: "⚙️ Use Cases (Live / Earn / Shortlet) — advanced"
        widget: "list"
        required: false
        field: { name: "useCase", label: "Use Case", widget: "string" }
        hint: "How buyers can use the property. Example: 'Live in it', 'Rent it out', 'Airbnb'"
      - name: "valuePillars"
        label: "Value Pillars — advanced"
        widget: "list"
        required: false
        field: { name: "pillar", label: "Pillar", widget: "string" }
        hint: "Core values the property represents. Example: 'Efficiency', 'Safety', 'Comfort'"

  # ============================================================
  # FAQs
  # ============================================================
  - name: "faqs"
    label: "FAQs"
    label_singular: "FAQ"
    folder: "content/faqs"
    create: true
    delete: true
    summary: "{{question}}"
    sortable_fields: ["order", "category"]
    view_filters:
      - label: "Investment"
        field: category
        pattern: "investment"
      - label: "Legal"
        field: category
        pattern: "legal"
      - label: "Property"
        field: category
        pattern: "property"
      - label: "Diaspora"
        field: category
        pattern: "diaspora"
      - label: "General"
        field: category
        pattern: "general"
    fields:
      - { name: "id", label: "ID (short, like f1, f2)", widget: "string", hint: "Just a unique short label. Example: f1, f2, f3" }
      - { name: "question", label: "Question", widget: "string", hint: "The question buyers ask. Example: 'How does the 17-year lease work?'" }
      - { name: "answer", label: "Answer", widget: "markdown", hint: "Type your answer. Use the toolbar to format — bold for emphasis, bullet points for lists." }
      - name: "category"
        label: "Category"
        widget: "select"
        hint: "Where this FAQ belongs"
        options:
          - { label: "💰 Investment", value: "investment" }
          - { label: "⚖️ Legal", value: "legal" }
          - { label: "🏠 Property", value: "property" }
          - { label: "🌍 Diaspora", value: "diaspora" }
          - { label: "📋 General", value: "general" }
        default: "general"
      - { name: "order", label: "Display Order", widget: "number", default: 1, hint: "Lower numbers appear first. Example: 1 shows before 5." }

  # ============================================================
  # USE-CASE SCENARIOS
  # ============================================================
  - name: "testimonials"
    label: "Use-Case Scenarios"
    label_singular: "Scenario"
    folder: "content/testimonials"
    create: true
    delete: true
    summary: "{{title}}"
    fields:
      - { name: "id", label: "ID (short)", widget: "string", hint: "Just a unique short label" }
      - { name: "title", label: "Title", widget: "string", hint: "Example: 'Live in it — Your own Lagos address'" }
      - { name: "scenario", label: "Short Subtitle", widget: "string", hint: "One line describing the scenario" }
      - { name: "description", label: "Full Description", widget: "markdown", hint: "Explain the scenario in detail. Use the toolbar for formatting." }
      - name: "category"
        label: "Category"
        widget: "select"
        options:
          - { label: "🏠 Live in it", value: "live" }
          - { label: "💰 Rent it out", value: "earn" }
          - { label: "🏨 Shortlet / Airbnb", value: "shortlet" }
          - { label: "🌍 Diaspora buyer", value: "diaspora" }
          - { label: "🤝 Realtor partner", value: "realtor" }
        default: "earn"
      - name: "outcomes"
        label: "Outcome Highlights (the numbers)"
        widget: "list"
        hint: "The impressive numbers buyers see. Click 'Add' for each one."
        fields:
          - { name: "label", label: "Label", widget: "string", hint: "Example: 'Annual Yield'" }
          - { name: "value", label: "Value", widget: "string", hint: "Example: '14%'" }

  # ============================================================
  # CLIENT TESTIMONIALS (real client quotes with photos)
  # ============================================================
  - name: "client-testimonials"
    label: "Client Testimonials"
    label_singular: "Client Testimonial"
    folder: "content/client-testimonials"
    create: true
    delete: true
    summary: "{{name}} — {{role}}"
    fields:
      - { name: "name", label: "Client Name", widget: "string" }
      - { name: "location", label: "Location", widget: "string", hint: "Example: 'Lagos, Nigeria' or 'London, UK'" }
      - { name: "role", label: "Role / Title", widget: "string", hint: "Example: 'Diaspora Investor' or 'Homeowner'" }
      - { name: "photo", label: "Photo", widget: "image", hint: "Square headshot works best. At least 400×400px." }
      - { name: "property", label: "Which Property Did They Buy? (optional)", widget: "string", required: false, hint: "Example: 'Sinai Spaces'" }
      - { name: "quote", label: "What They Said", widget: "text", hint: "The testimonial quote. Keep it natural and authentic." }
      - { name: "rating", label: "Star Rating", widget: "number", default: 5, min: 1, max: 5, hint: "1-5 stars. Most are 5." }
      - { name: "featured", label: "Show on Homepage?", widget: "boolean", default: true, hint: "Toggle on to feature this on the homepage" }

  # ============================================================
  # BLOG POSTS
  # ============================================================
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "content/blog"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    view_filters:
      - label: "Published in 2026"
        field: date
        pattern: "2026"
    fields:
      - { name: "title", label: "Article Title", widget: "string" }
      - { name: "slug", label: "Web Address (auto-filled)", widget: "string", hint: "Lowercase with dashes. Example: why-lagos-2026-outperforms" }
      - { name: "excerpt", label: "Short Summary", widget: "text", hint: "1-2 sentence preview shown on the blog listing page" }
      - name: "category"
        label: "Category"
        widget: "select"
        options:
          - { label: "💰 Investment", value: "investment" }
          - { label: "📊 Market", value: "market" }
          - { label: "🌍 Diaspora", value: "diaspora" }
          - { label: "📖 Guide", value: "guide" }
          - { label: "🏢 Company", value: "company" }
        default: "market"
      - { name: "date", label: "Publish Date", widget: "datetime" }
      - { name: "readTime", label: "Reading Time", widget: "string", hint: "Example: '7 min read'" }
      - { name: "author", label: "Author", widget: "string", default: "Engrite Innovations" }
      - { name: "cover", label: "Cover Image", widget: "image", hint: "Wide landscape image. Shows at the top of the article." }
      - { name: "body", label: "Article Body", widget: "markdown", hint: "Write your article here. Use the toolbar for headings, bold, links, images, etc." }

  # ============================================================
  # SITE SETTINGS (singleton)
  # ============================================================
  - name: "settings"
    label: "Site Settings"
    delete: false
    editor:
      preview: false
    files:
      - name: "site"
        label: "Contact Info & Site Text"
        file: "content/settings/site.md"
        description: "Phone numbers, email, hero text, social links — changes here update the entire site."
        fields:

          # ---------- CONTACT INFO ----------
          - name: "contact"
            label: "📞 Contact Information"
            widget: "object"
            collapsed: false
            fields:
              - { name: "phonePrimary", label: "Primary Phone Number", widget: "string", hint: "Main number customers call" }
              - { name: "phoneSecondary", label: "Secondary Phone (optional)", widget: "string" }
              - { name: "email", label: "Email Address", widget: "string" }
              - { name: "address", label: "Office Address", widget: "text" }
              - { name: "whatsappNumber", label: "WhatsApp Number", widget: "string", hint: "No + or spaces. Example: 2348130665862" }
              - { name: "hours", label: "Business Hours", widget: "string", hint: "Example: 'Mon–Fri, 9am – 6pm'" }

          # ---------- SOCIAL LINKS ----------
          - name: "social"
            label: "📲 Social Media Links"
            widget: "object"
            collapsed: false
            fields:
              - { name: "instagram", label: "Instagram URL", widget: "string", hint: "Full link, example: https://instagram.com/engriteinnovations_" }
              - { name: "linkedin", label: "LinkedIn URL", widget: "string" }
              - { name: "facebook", label: "Facebook URL", widget: "string" }

          # ---------- HOMEPAGE HERO ----------
          - name: "hero"
            label: "🎯 Homepage Banner"
            widget: "object"
            collapsed: false
            fields:
              - { name: "eyebrow", label: "Small Label (top of banner)", widget: "string", hint: "Example: 'Lagos · Nigeria'" }
              - { name: "titleLine1", label: "Headline Line 1", widget: "string" }
              - { name: "titleLine2", label: "Headline Line 2", widget: "string" }
              - { name: "titleLine3", label: "Headline Line 3", widget: "string" }
              - { name: "subtitle", label: "Subtitle", widget: "text", hint: "1-2 sentence description below the headline" }
              - { name: "primaryCta", label: "Primary Button Text", widget: "string", hint: "Main button. Example: 'Explore Properties'" }
              - { name: "secondaryCta", label: "Secondary Button Text", widget: "string", hint: "Second button. Example: 'Book a Site Visit'" }

          # ---------- HOMEPAGE STATS ----------
          - name: "stats"
            label: "📊 Homepage Stats Bar"
            widget: "object"
            collapsed: true
            hint: "The four numbers shown below the homepage banner"
            fields:
              - { name: "annualReturn", label: "Stat 1 — Value", widget: "string", hint: "Example: '14%'" }
              - { name: "annualReturnLabel", label: "Stat 1 — Label", widget: "string", hint: "Example: 'Target Gross Yield'" }
              - { name: "leaseTerm", label: "Stat 2 — Value", widget: "string" }
              - { name: "leaseTermLabel", label: "Stat 2 — Label", widget: "string" }
              - { name: "activeProjects", label: "Stat 3 — Value", widget: "string" }
              - { name: "activeProjectsLabel", label: "Stat 3 — Label", widget: "string" }
              - { name: "legalFees", label: "Stat 4 — Value", widget: "string" }
              - { name: "legalFeesLabel", label: "Stat 4 — Label", widget: "string" }

          # ---------- COMPANY INFO ----------
          - name: "company"
            label: "🏢 Company Information"
            widget: "object"
            collapsed: true
            fields:
              - { name: "name", label: "Company Name", widget: "string" }
              - { name: "legalName", label: "Legal Name", widget: "string" }
              - { name: "rcNumber", label: "RC Number", widget: "string" }
              - { name: "tagline", label: "Tagline", widget: "string" }
              - { name: "established", label: "Year Established", widget: "string" }
              - { name: "description", label: "About the Company", widget: "text" }

          # ---------- FOUNDER ----------
          - name: "founder"
            label: "👤 Founder / CEO"
            widget: "object"
            collapsed: true
            fields:
              - { name: "name", label: "Name", widget: "string" }
              - { name: "title", label: "Title", widget: "string", hint: "Example: 'CEO & Real Estate Developer'" }
              - { name: "role", label: "Role / Specialty", widget: "string" }
              - { name: "education", label: "Education", widget: "string" }
              - { name: "location", label: "Location", widget: "string" }

          # ---------- DIASPORA SECTION ----------
          - name: "diaspora"
            label: "🌍 Diaspora Section"
            widget: "object"
            collapsed: true
            fields:
              - { name: "title", label: "Section Title", widget: "string" }
              - { name: "description", label: "Section Description", widget: "text" }
              - { name: "closingTime", label: "Closing Time", widget: "string" }

          # ---------- FOOTER ----------
          - name: "footer"
            label: "📄 Footer"
            widget: "object"
            collapsed: true
            fields:
              - { name: "aboutBlurb", label: "About Blurb (short text in footer)", widget: "text" }
              - { name: "copyright", label: "Copyright Text", widget: "string" }
