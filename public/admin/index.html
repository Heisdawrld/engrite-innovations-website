<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Content Manager · Engrite Innovations</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      /* Loading state — Decap CMS takes ~1 second to mount */
      body {
        margin: 0;
        background: #081534;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #fff;
      }
      .cms-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        z-index: 9999;
      }
      .cms-loading__logo {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .cms-loading__spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #2ba84a;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .cms-loading__hint {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.6);
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="nc-root"></div>
    <div class="cms-loading" id="cms-loading">
      <div class="cms-loading__logo">Engrite Admin</div>
      <div class="cms-loading__spinner"></div>
      <div class="cms-loading__hint">Loading content manager…</div>
    </div>

    <!-- Netlify Identity widget — must load before Decap CMS -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <!-- Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.6.0/dist/decap-cms.js"></script>

    <!-- Hide loading spinner once CMS is ready -->
    <script>
      window.addEventListener('load', () => {
        const checkReady = setInterval(() => {
          if (document.querySelector('.nc-app-header')) {
            const loading = document.getElementById('cms-loading');
            if (loading) loading.remove();
            clearInterval(checkReady);
          }
        }, 200);
        // Safety: hide spinner after 10 seconds even if CMS hasn't fully loaded
        setTimeout(() => {
          const loading = document.getElementById('cms-loading');
          if (loading) loading.style.opacity = '0.3';
        }, 10000);
      });

      // Redirect to the site after login (Netlify Identity requires this)
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', (user) => {
          if (!user) {
            window.netlifyIdentity.on('login', () => {
              document.location.href = '/admin/';
            });
          }
        });
      }
    </script>
  </body>
</html>
