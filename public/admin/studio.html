<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#071128" />
    <title>Engrite Content Studio</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/admin/admin.css" />
    <style>
      body {
        margin: 0;
        background: #081534;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #fff;
      }
      .cms-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        z-index: 9999;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="nc-root"></div>
    <div class="cms-loading" id="cms-loading">
      <div class="cms-loading__orb cms-loading__orb--one"></div>
      <div class="cms-loading__orb cms-loading__orb--two"></div>
      <div class="cms-loading__panel">
        <div class="cms-loading__brand">
          <img src="/img/favicon.svg" width="44" height="40" alt="" />
          <div>
            <strong>ENGRITE</strong>
            <span>CONTENT STUDIO</span>
          </div>
        </div>

        <div class="cms-loading__eyebrow">Secure publishing workspace</div>
        <h1>
          Shape the site.
          <em>Stay in control.</em>
        </h1>
        <p>
          Manage developments, verified updates, client stories and company
          information from one protected workspace.
        </p>

        <div class="cms-loading__progress" aria-hidden="true">
          <span></span>
        </div>
        <div class="cms-loading__meta">
          <span><i></i>Main branch</span>
          <span><i></i>Automatic deployment</span>
        </div>
      </div>
      <a class="cms-loading__site-link" href="/" target="_blank" rel="noopener">
        View live website ↗
      </a>
    </div>

    <a class="studio-home-link" href="/admin/" aria-label="Return to the Engrite admin dashboard">
      <span aria-hidden="true">←</span> Dashboard
    </a>

    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://unpkg.com/decap-cms@^3.6.0/dist/decap-cms.js"></script>
    <script>
      window.addEventListener("load", () => {
        const checkReady = setInterval(() => {
          const root = document.getElementById("nc-root");
          const isReady =
            document.querySelector(".nc-app-header") ||
            document.querySelector('[class*="AuthenticationPage"]') ||
            document.querySelector('[class*="StyledAuthenticationPage"]') ||
            (root && root.innerHTML.length > 500);
          if (isReady) {
            document.getElementById("cms-loading")?.remove();
            clearInterval(checkReady);
          }
        }, 150);

        setTimeout(() => {
          document.getElementById("cms-loading")?.remove();
        }, 6000);
      });

      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", (user) => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/studio.html";
            });
          }
        });
      }
    </script>
  </body>
</html>
