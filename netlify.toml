# Netlify configuration for Next.js
# https://docs.netlify.com/frameworks/next-js/overview/

[build]
  command = "npm run build:netlify"
  publish = ".next/"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment variables for the build
[build.environment]
  NODE_VERSION = "20"
  # Prisma needs DATABASE_URL at build time for generate
  # Using a placeholder since the DB file is not used in production API routes
  DATABASE_URL = "file:./dev.db"

# Headers for performance and security
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
