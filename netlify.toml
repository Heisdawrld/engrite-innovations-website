# Netlify configuration for Engrite Innovations
# Static site with Netlify-native form handling (no Next.js plugin needed)

[build]
  command = "npm run build:netlify"
  publish = ".next/"

# Environment variables for the build
[build.environment]
  NODE_VERSION = "20"
  # Prisma needs DATABASE_URL at build time for generate
  # Using a placeholder since the DB file is not used in production API routes
  DATABASE_URL = "file:./dev.db"

# Headers for performance and security
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
